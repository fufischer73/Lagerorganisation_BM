# Kursbeschreibung – Lernpfad Lager (Kaufleute für Büromanagement)
titel: Lernpfad Lager
kurzname: lernpfad-lager
ueberschrift: Lager – organisieren, absichern, auswerten
untertitel: Du lernst, wie ein Lager aufgebaut ist, wie man sicher und umweltbewusst darin arbeitet und wie du mit Lagerkennzahlen beurteilst, ob sich ein Lager rechnet.
badges: [OnlyOffice, 3 Stufen · ca. 10,5 Std.]
fusszeile: BBZ Rendsburg-Eckernförde · Stand 10/2026

einleitung: |
  :::notiz 👉 Bevor du startest
  1. Arbeite die Module **der Reihe nach** durch. Jede Stufe endet mit einem Meilenstein.
  2. Alle Aufgaben kannst du **selbst kontrollieren**. Rechenaufgaben haben drei Hilfen: **Tipp**, **Rechenweg** und **Ergebnis**. Versuche es zuerst allein und öffne nur so viel Hilfe, wie du brauchst.
  3. Alles geschieht in der Schule, du brauchst keine Hausaufgaben zu machen.
  :::

  Als Beispielunternehmen begleitet dich die **BüroComfort GmbH**, ein Großhandel für Büromöbel und Bürobedarf. Die Personen und Zahlen sind ausgedacht.

